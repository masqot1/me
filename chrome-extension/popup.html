<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrueWebsiteCloner</title>
<style>body{margin:0;width:350px;font:14px Segoe UI,system-ui,sans-serif;background:#0f1218;color:#eef2f8}.wrap{padding:18px}.brand{font-size:18px;font-weight:750}.sub{color:#8590a3;font-size:12px;margin-top:4px}.card{margin-top:14px;padding:14px;background:#171c25;border:1px solid #2b3443;border-radius:10px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.label{color:#8c96a8}.value{font-family:Consolas,monospace;font-size:11px;max-width:190px;overflow:hidden;text-overflow:ellipsis}.status{margin-top:12px;padding:10px;border-radius:8px;background:#10141b;color:#abb5c5;min-height:40px;white-space:pre-wrap}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{border:1px solid #44536c;background:#27364f;color:white;border-radius:9px;padding:9px;font-weight:650;cursor:pointer}.wide{grid-column:1/-1}button:disabled{opacity:.5}</style></head>
<body><div class="wrap"><div class="brand">TrueWebsiteCloner</div><div class="sub">Network Capture Core · v0.2</div><div class="card">
<div class="row"><span class="label">Extension</span><span id="extensionId" class="value"></span></div>
<div class="row"><span class="label">Capture</span><span id="captureState">OFF</span></div>
<div class="row"><span class="label">Events</span><span id="eventCount">0</span></div>
<div class="buttons"><button id="startButton">Start</button><button id="reloadButton">Start + Reload</button><button id="stopButton" class="wide">Stop Capture</button><button id="testButton" class="wide">Test Desktop Connection</button></div>
<div id="status" class="status">Ready.</div></div></div><script src="popup.js"></script></body></html>
