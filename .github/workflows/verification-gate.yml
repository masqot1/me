name: TrueWebsiteCloner Offline Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    name: Gate 0.6 / TestLab vs Offline Runtime
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build TrueWebsiteCloner
        shell: pwsh
        run: ./scripts/Install-Dev.ps1

      - name: Install Puppeteer and Chrome for Testing
        shell: pwsh
        run: |
          Push-Location ./tests/runtime-gate-0.2B
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm install failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }

      - name: Capture Test Lab, build offline tree, compare and browser-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gateRoot = Join-Path $env:GITHUB_WORKSPACE 'verification-gate-output'
          if (Test-Path $gateRoot) { Remove-Item $gateRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $gateRoot -Force | Out-Null
          $env:TWC_PROJECT_ROOT = $gateRoot

          $testLabExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\testlab\TrueWebsiteCloner.TestLab.exe'
          $desktopExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\desktop\TrueWebsiteCloner.exe'
          $offlineToolExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\offline-tool\TrueWebsiteCloner.OfflineTool.exe'
          $runtimeExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\local-runtime\TrueWebsiteCloner.LocalRuntime.exe'
          $bridgeInfo = Join-Path $env:LOCALAPPDATA 'TrueWebsiteCloner\runtime\bridge-info.json'
          $testLab = $null
          $desktop = $null
          $runtime = $null

          try {
            $testLab = Start-Process -FilePath $testLabExe -PassThru -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { if ((Invoke-RestMethod 'http://127.0.0.1:7843/health' -TimeoutSec 2).ok) { $ready = $true; break } } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Test Lab did not become ready.' }

            $desktop = Start-Process -FilePath $desktopExe -PassThru
            for ($i = 0; $i -lt 30 -and -not (Test-Path $bridgeInfo); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $bridgeInfo)) { throw 'Desktop bridge did not become ready.' }

            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tests\runtime-gate-0.2B')
            try {
              node ./run-v0.3.mjs
              if ($LASTEXITCODE -ne 0) { throw "Real Chrome capture exited with $LASTEXITCODE" }
            }
            finally { Pop-Location }

            $summary = Get-ChildItem $gateRoot -Filter summary.json -Recurse -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if (-not $summary) { throw 'Real capture summary.json was not found.' }
            $networkDir = Split-Path $summary.FullName -Parent
            $captureRoot = Split-Path $networkDir -Parent

            & $offlineToolExe --capture $captureRoot
            if ($LASTEXITCODE -ne 0) { throw "Offline build failed with $LASTEXITCODE" }

            $runtime = Start-Process -FilePath $runtimeExe -ArgumentList @('--capture', $captureRoot, '--port', '7852') -PassThru -WindowStyle Hidden
            $runtimeHealth = $null
            for ($i = 0; $i -lt 30; $i++) {
              try { $runtimeHealth = Invoke-RestMethod 'http://127.0.0.1:7852/__twc/health' -TimeoutSec 2; if ($runtimeHealth.ok) { break } } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $runtimeHealth.ok) { throw 'Local Runtime did not become ready.' }

            & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Verify-OfflineTestLab.ps1') -CaptureRoot $captureRoot
            if ($LASTEXITCODE -ne 0) { throw "Offline verification script exited with $LASTEXITCODE" }

            $reportPath = Join-Path $captureRoot 'offline\verification-report.json'
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json -Depth 50
            if ($report.result -ne 'PASS' -or [int]$report.unexpectedDivergences -ne 0) { throw 'Verification report is not PASS.' }
            if ([int]$report.routeCount -lt 4) { throw "Expected at least 4 captured routes, got $($report.routeCount)." }
            if ([int]$report.expectedRewrites -lt 1) { throw 'Expected at least one HTML/CSS rewrite comparison.' }

            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tests\runtime-gate-0.2B')
            try {
              node ./run-v0.6.mjs http://127.0.0.1:7852
              if ($LASTEXITCODE -ne 0) { throw "Offline browser smoke exited with $LASTEXITCODE" }
            }
            finally { Pop-Location }

            Write-Host 'PASS  Real Chrome Test Lab capture'
            Write-Host 'PASS  Offline tree built from real response bodies'
            Write-Host 'PASS  Source-vs-replay route verification'
            Write-Host 'PASS  Offline browser JavaScript/API behavior'
            Write-Host 'PASS  No external browser HTTP traffic'
            Write-Host 'RESULT: GATE 0.6 PASS'
          }
          finally {
            if ($runtime -and -not $runtime.HasExited) { Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue }
            if ($desktop -and -not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue }
            if ($testLab -and -not $testLab.HasExited) { Stop-Process -Id $testLab.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Gate 0.6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: truewebsitecloner-gate-0.6-${{ github.run_number }}
          path: verification-gate-output/
          if-no-files-found: warn
          retention-days: 14
