name: TrueWebsiteCloner Visual Comparison Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-comparison:
    name: Gate 0.9 / Source vs Offline Visual Diff
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build TrueWebsiteCloner
        shell: pwsh
        run: ./scripts/Install-Dev.ps1

      - name: Install browser test dependencies
        shell: pwsh
        run: |
          Push-Location ./tests/runtime-gate-0.2B
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm install failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }

      - name: Capture, recover, replay and compare visuals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gateRoot = Join-Path $env:GITHUB_WORKSPACE 'visual-gate-output'
          if (Test-Path $gateRoot) { Remove-Item $gateRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $gateRoot -Force | Out-Null
          $env:TWC_PROJECT_ROOT = $gateRoot

          $testLabExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\testlab\TrueWebsiteCloner.TestLab.exe'
          $desktopExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\desktop\TrueWebsiteCloner.exe'
          $offlineToolExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\offline-tool\TrueWebsiteCloner.OfflineTool.exe'
          $recoveryToolExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\recovery-tool\TrueWebsiteCloner.RecoveryTool.exe'
          $runtimeExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\local-runtime\TrueWebsiteCloner.LocalRuntime.exe'
          $bridgeInfo = Join-Path $env:LOCALAPPDATA 'TrueWebsiteCloner\runtime\bridge-info.json'
          $testLab = $null
          $desktop = $null
          $runtime = $null

          try {
            $testLab = Start-Process -FilePath $testLabExe -PassThru -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { if ((Invoke-RestMethod 'http://127.0.0.1:7843/health' -TimeoutSec 2).ok) { $ready = $true; break } } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Test Lab did not become ready.' }

            $desktop = Start-Process -FilePath $desktopExe -PassThru
            for ($i = 0; $i -lt 30 -and -not (Test-Path $bridgeInfo); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $bridgeInfo)) { throw 'Desktop bridge did not become ready.' }

            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tests\runtime-gate-0.2B')
            try {
              node ./run-v0.3.mjs
              if ($LASTEXITCODE -ne 0) { throw 'Real Chrome capture failed.' }
            }
            finally { Pop-Location }

            $summary = Get-ChildItem $gateRoot -Filter summary.json -Recurse -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if (-not $summary) { throw 'Capture summary.json was not found.' }
            $captureRoot = Split-Path (Split-Path $summary.FullName -Parent) -Parent

            & $offlineToolExe --capture $captureRoot
            if ($LASTEXITCODE -ne 0) { throw 'Offline build failed.' }
            & $recoveryToolExe --capture $captureRoot
            if ($LASTEXITCODE -ne 0) { throw 'Recovery failed.' }

            $runtime = Start-Process -FilePath $runtimeExe -ArgumentList @('--capture', $captureRoot, '--port', '7854') -PassThru -WindowStyle Hidden
            $runtimeHealth = $null
            for ($i = 0; $i -lt 30; $i++) {
              try { $runtimeHealth = Invoke-RestMethod 'http://127.0.0.1:7854/__twc/health' -TimeoutSec 2; if ($runtimeHealth.ok) { break } } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $runtimeHealth.ok) { throw 'Local Runtime did not become ready.' }

            $visualDir = Join-Path $captureRoot 'offline\visual-comparison'
            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tests\runtime-gate-0.2B')
            try {
              node ./run-v0.9.mjs http://127.0.0.1:7843 http://127.0.0.1:7854 $visualDir
              if ($LASTEXITCODE -ne 0) { throw 'Visual comparison failed.' }
            }
            finally { Pop-Location }

            $report = Get-Content (Join-Path $visualDir 'visual-report.json') -Raw | ConvertFrom-Json -Depth 20
            if ($report.result -ne 'PASS') { throw 'Visual report is not PASS.' }
            if ([double]$report.mismatchPercent -gt [double]$report.maxMismatchPercent) { throw 'Visual mismatch exceeds threshold.' }
            if (@($report.offlineExternalRequests).Count -ne 0) { throw 'Offline screenshot observed external HTTP traffic.' }
            foreach ($file in @('source.png','offline.png','diff.png')) {
              if (-not (Test-Path (Join-Path $visualDir $file))) { throw "Visual evidence missing: $file" }
            }

            Write-Host "PASS  Visual mismatch: $($report.mismatchPercent)%"
            Write-Host 'PASS  Source/offline/diff screenshots saved'
            Write-Host 'PASS  API-rendered state compared'
            Write-Host 'PASS  Offline browser made no external HTTP requests'
            Write-Host 'RESULT: GATE 0.9 PASS'
          }
          finally {
            if ($runtime -and -not $runtime.HasExited) { Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue }
            if ($desktop -and -not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue }
            if ($testLab -and -not $testLab.HasExited) { Stop-Process -Id $testLab.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Gate 0.9 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: truewebsitecloner-gate-0.9-${{ github.run_number }}
          path: visual-gate-output/
          if-no-files-found: warn
          retention-days: 14
