name: TrueWebsiteCloner Diagnostics Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Gate 0.13 / Project Diagnostics Health Model
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Desktop and tools
        shell: pwsh
        run: ./scripts/Install-Dev.ps1
      - name: Validate diagnostics report boundaries
        shell: pwsh
        run: |
          $source = Get-Content './src/TrueWebsiteCloner.Core/ProjectDiagnosticsService.cs' -Raw
          foreach ($required in @('PASS','WARNING','FAIL','NOT_RUN','EvidencePath','RecommendedAction','project-health.json')) {
            if ($source -notmatch [regex]::Escape($required)) { throw "Diagnostics model element missing: $required" }
          }
          Write-Host 'PASS  health status, evidence and next-action model present'
      - name: Run Project Diagnostics Gate 0.13
        shell: pwsh
        env:
          TWC_DIAGNOSTICS_GATE_OUTPUT: ${{ github.workspace }}\diagnostics-gate-output
        run: dotnet run --project ./tests/TrueWebsiteCloner.DiagnosticsGateTests/TrueWebsiteCloner.DiagnosticsGateTests.csproj -c Release
      - name: Upload Gate 0.13 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: truewebsitecloner-gate-0.13-${{ github.run_number }}
          path: diagnostics-gate-output/
          if-no-files-found: warn
          retention-days: 14
