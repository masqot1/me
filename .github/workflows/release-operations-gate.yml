name: TrueWebsiteCloner Release Operations Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-operations:
    name: Gate 0.17 / End-to-End Release Smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build TrueWebsiteCloner
        shell: pwsh
        run: ./scripts/Install-Dev.ps1
      - name: Validate one-command release script
        shell: pwsh
        run: |
          $script = Get-Content './scripts/Release-Project.ps1' -Raw
          foreach ($required in @('ReleaseTool','SealTool','BundleTool','RESULT: RELEASE PASS')) {
            if ($script -notmatch [regex]::Escape($required)) { throw "Release workflow element missing: $required" }
          }
          Write-Host 'PASS  one-command release workflow is wired'
      - name: Run Gate 0.17 end-to-end release smoke
        shell: pwsh
        env:
          TWC_RELEASE_OPS_GATE_OUTPUT: ${{ github.workspace }}\release-operations-gate-output
        run: dotnet run --project ./tests/TrueWebsiteCloner.ReleaseOperationsGateTests/TrueWebsiteCloner.ReleaseOperationsGateTests.csproj -c Release
      - name: Upload Gate 0.17 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: truewebsitecloner-gate-0.17-${{ github.run_number }}
          path: release-operations-gate-output/
          if-no-files-found: warn
          retention-days: 14
